[package]
name = "tpt-workspaces-backend-windows"
description = "tpt-workspaces: Windows virtual desktop backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tpt-workspaces-core = { path = "../core" }

# The whole crate is Windows-only; these dependencies are only fetched and built on Windows.
[target.'cfg(windows)'.dependencies]
thiserror = "2"
# Windows 11 virtual desktop COM API (requires Windows 11 24H2, build 26100.2605 or later).
# Uses the same `windows` crate version as winvd so HWND/GUID types are shared.
winvd = "0.0.49"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
