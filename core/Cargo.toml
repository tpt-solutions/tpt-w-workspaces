[package]
name = "tpt-workspaces-core"
description = "Platform-agnostic domain model, rule matching, state transitions and storage for tpt-workspaces"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
serde_json = "1"
dirs = "5"
notify = { version = "8", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[features]
default = []
# Live-reload of the TOML config file via filesystem notifications.
watch = ["dep:notify"]
# SQLite-backed implementation of `storage::StateStore`.
sqlite = ["dep:rusqlite"]
